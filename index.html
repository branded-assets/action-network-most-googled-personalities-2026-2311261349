  --ink:#10243e; --ink-2:#1b3558; --muted:#53657b; --line:#cfd9e5; --bg:#eef2f7; --card:#fff;
  --lime:#4be08a; --green:#17995a; --green-dark:#0f7443; --screen:#0b1a30; --nodata:#2a3d5a;
  --gold:#f5c542; --silver:#c7d0db; --bronze:#d9935a;
  --pix:'Public Sans','Helvetica Neue',Arial,sans-serif; --body:'Public Sans','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;background:var(--bg);
  }
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}
a{color:var(--green-dark)}

/* header */
header.top{background-color:var(--ink);position:relative;overflow:hidden;color:#fff;padding:26px 0 0;border-bottom:4px solid var(--lime)}
header.top::before,.foot::before{content:"";position:absolute;top:0;right:0;bottom:0;width:40%;background-image:var(--icons);background-size:480px 520px;background-position:right top;pointer-events:none;
  -webkit-mask-image:linear-gradient(to left,#000 30%,transparent 100%);mask-image:linear-gradient(to left,#000 30%,transparent 100%)}
header.top .wrap,.foot .wrap{position:relative;z-index:1}
.hero{display:flex;gap:24px;justify-content:space-between;align-items:flex-start}
header.top h1{font-family:var(--pix);font-weight:800;font-size:clamp(28px,4.4vw,46px);line-height:1.1;letter-spacing:-.015em;margin:0 0 10px;max-width:17em}
header.top p.lede{margin:0;color:#c3d1e2;max-width:48em}
header.top p.lede b{color:var(--lime);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0}
.chip{border:2px solid #34527e;background:#16304f;padding:6px 12px;display:flex;gap:8px;align-items:baseline}
.chip b{font-family:var(--pix);font-size:22px;color:var(--lime);font-weight:700;line-height:1}
.chip span{font-size:13.5px;color:#c3d1e2}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:22px;padding-bottom:0}
.tabs button{font:700 17px var(--pix);color:#c3d1e2;background:transparent;border:3px solid transparent;border-bottom:0;padding:10px 18px 9px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabs button:hover{color:#fff}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.tabs button[aria-selected="true"]::before{content:"";width:10px;height:12px;background:var(--green);clip-path:polygon(0 0,100% 50%,0 100%)}
button:focus-visible,input:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}

/* layout */
main.wrap{padding-top:36px;padding-bottom:56px}
.sechead{display:flex;flex-wrap:wrap;gap:16px 28px;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.headline{font-family:var(--pix);font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1.15;letter-spacing:-.01em;margin:0 0 8px;max-width:24em}
.sub{color:var(--muted);margin:0;max-width:50em}
.seg{display:inline-flex;border:3px solid var(--ink);background:#fff;box-shadow:4px 4px 0 var(--ink)}
.seg button{font:700 15px var(--pix);color:var(--ink);background:#fff;border:0;padding:8px 20px;cursor:pointer}
.seg button+button{border-left:3px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--lime)}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:20px}
.card h3{font-family:var(--pix);font-size:21px;margin:0 0 4px;font-weight:700}
.card .note{color:var(--muted);font-size:14px;margin:0 0 14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:34px}

/* map screen */
.screen{background:var(--screen);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--green);padding:0;position:relative;overflow:hidden}
.map{background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px;min-height:260px}
.map svg{display:block;width:100%;height:auto;cursor:grab}
.map svg:active{cursor:grabbing}
.map path{stroke:#0b1a30;stroke-width:.6px;vector-effect:non-scaling-stroke;transition:opacity .15s;cursor:pointer}
.map path:hover{stroke:#fff;stroke-width:1.4px}
.map path.dim{opacity:.16}
.map path.sel{stroke:#fff;stroke-width:2.4px}
.maperr{padding:60px 20px;text-align:center;color:#c3d1e2}
.hud{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;background:#112642;border-top:3px solid #34527e;padding:12px 16px;color:#e7eef7;min-height:68px}
.hud-info{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 360px}
.hud-info .sw{width:22px;height:22px;flex-shrink:0;border:2px solid #fff}
.hud-name{font-family:var(--pix);font-size:22px;line-height:1.1;font-weight:700;color:#fff}
.hud-line{font-size:14.5px;color:#c3d1e2}
.hud-line b{color:var(--lime);font-weight:600}
.hud-prompt{font-family:var(--pix);font-size:18px;color:var(--lime)}
.hud-stats{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:#c3d1e2}
.hud-stats b{color:#fff;font-weight:600}
.zoom{display:flex;gap:6px}
.zoom button{font:700 16px var(--pix);min-width:40px;height:36px;padding:0 10px;background:var(--lime);color:var(--ink);border:2px solid #fff;cursor:pointer}
.zoom button:hover{background:#8af0b4}
.hint{margin:0;padding:6px 16px 10px;background:#112642;color:#8fa6c2;font-size:12.5px}
.scale{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 16px;background:#112642;border-top:1px solid #243e63;color:#c3d1e2;font-size:12.5px}
.scale span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:14px}

/* leaderboard */
.lb{list-style:none;margin:0;padding:0;max-height:520px;overflow:auto}
.lb li{margin:0 0 4px}
.lb button{width:100%;display:grid;grid-template-columns:34px 16px minmax(0,1fr) auto;gap:6px 10px;align-items:center;text-align:left;font:500 15.5px var(--body);color:var(--ink);background:transparent;border:2px solid transparent;padding:7px 8px;cursor:pointer}
.lb button:hover{background:#eef3f8;border-color:#d7e0ea}
.lb button[aria-pressed="true"]{background:#e3f6ec;border-color:var(--green)}
.rk{font-family:var(--pix);font-weight:700;font-size:17px;width:30px;height:30px;display:grid;place-items:center;background:#e6ecf3;border:2px solid var(--ink)}
.rk.r1{background:var(--gold)}.rk.r2{background:var(--silver)}.rk.r3{background:var(--bronze)}
.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .n{font-family:var(--pix);font-weight:700;font-size:18px;text-align:right}
.lb .n small{font:400 12.5px var(--body);color:var(--muted);margin-left:6px}
.xp{grid-column:3 / 5;height:10px;margin-top:-2px;background:repeating-linear-gradient(90deg,#dfe7f0 0 8px,transparent 8px 11px)}
.xp i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 11px)}
.vol{list-style:none;margin:0;padding:0}
.vol li{display:grid;grid-template-columns:30px minmax(0,34%) minmax(0,1fr);gap:10px;align-items:center;padding:5px 0;font-size:15px}
.vol .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vol .trk{display:flex;align-items:center;gap:10px;min-width:0}
.vol .xp{grid-column:auto;margin:0;flex:1 1 auto;min-width:20px}
.vol .val{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);white-space:nowrap;flex:0 0 auto}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-bottom:26px}
.stat{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px 16px}
.stat .big{font-family:var(--pix);font-weight:700;font-size:30px;line-height:1.1}
.stat .lbl{color:var(--muted);font-size:14px;margin-top:4px}
.spot{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;padding:34px}
.spot h3{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:0 0 10px}
.spot p{margin:0 0 8px;max-width:40em}
.spot .link{font:700 15px var(--pix);background:var(--ink);color:var(--lime);border:0;padding:10px 18px;cursor:pointer;margin-top:10px}

/* table */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:12px}
.toolbar input{font:400 15px var(--body);padding:9px 12px;border:3px solid var(--ink);min-width:260px;color:var(--ink);background:#fff;border-radius:0}
.tablewrap{overflow:auto;border:3px solid var(--ink);max-height:600px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 9px;text-align:right;border-bottom:1px solid #e3e9f0;white-space:nowrap}
th{white-space:normal;vertical-align:bottom;line-height:1.25}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
th{background:var(--ink);color:#fff;position:sticky;top:0;z-index:1}
th button{all:unset;cursor:pointer;font:700 13px var(--pix);display:inline-block;text-align:inherit}
th button:hover{color:var(--lime)}
th button:focus-visible{outline:3px solid #ffd54a}
tbody tr:nth-child(even){background:#f6f9fc}
td.per{font-weight:700;color:var(--green-dark)}

/* methodology */
.method{margin-top:40px;color:var(--muted);font-size:15px;max-width:66em}
.method h3{font-family:var(--pix);color:var(--ink);font-size:22px;margin:0 0 10px}
.method ul{margin:0 0 14px;padding-left:22px}
.method li{margin-bottom:5px}
details[open] 
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:13.5px;padding:8px 11px;border:2px solid var(--lime);z-index:20;opacity:0;max-width:250px;line-height:1.35}

@media (max-width:920px){.two{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.sprites{display:none}.spot{grid-template-columns:1fr}.lb{max-height:none}}
@media (max-width:600px){.wrap{padding:0 14px}.vol li{grid-template-columns:30px minmax(0,40%) minmax(0,1fr)}.card{padding:14px;box-shadow:4px 4px 0 var(--ink)}}
@media (prefers-reduced-motion:reduce){.map path{transition:none}}

/* footer */
.foot{position:relative;overflow:hidden;background:var(--ink);border-top:4px solid var(--lime);color:#c3d1e2;padding:28px 0}
.foot a{font-weight:800;font-size:22px;color:#fff;text-decoration:none;letter-spacing:-.01em}
.foot a:hover{color:var(--lime)}
.foot p{margin:4px 0 0;font-size:14px}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-bottom:26px}
.pod{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:16px 18px}
.pod.p1{border-top:10px solid var(--gold)}.pod.p2{border-top:10px solid var(--silver)}.pod.p3{border-top:10px solid var(--bronze)}
.pod-top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pod-name{font-weight:800;font-size:22px;line-height:1.15}
.pod-num{font-weight:800;font-size:40px;line-height:1.05;color:var(--green-dark);letter-spacing:-.02em}
.pod-lbl{color:var(--muted);font-size:14px;margin-bottom:8px}
.pod-meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:14px}
.pod-meta b{font-weight:600}
@media (max-width:920px){.podium{grid-template-columns:1fr}header.top::before{display:none}}

@media (max-width:700px){.tabs{flex-wrap:wrap;overflow:visible}}

/* rank 1 shine */
.map path.top1{stroke:#fff;stroke-width:2px;filter:drop-shadow(0 0 4px rgba(255,255,255,.9)) drop-shadow(0 0 10px rgba(120,255,190,.75));animation:shine 2.4s ease-in-out infinite alternate}
@keyframes shine{from{filter:drop-shadow(0 0 3px rgba(255,255,255,.65)) drop-shadow(0 0 6px rgba(120,255,190,.45))}to{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 15px rgba(120,255,190,.95))}}
.map .ring{fill:none;stroke:#fff;stroke-width:1.5px;vector-effect:non-scaling-stroke;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{opacity:.95;transform:scale(.6)}100%{opacity:0;transform:scale(2.6)}}
.sw-top{background:#a2f5c8;border:2px solid #fff;box-shadow:0 0 6px #fff;width:14px;height:14px}
@media (prefers-reduced-motion:reduce){.map path.top1,.map .ring{animation:none}.map .ring{opacity:.8}}
.bystate{margin:0;max-height:420px;overflow:auto}
.bystate dt{font-weight:600;margin-top:12px;display:flex;gap:8px;align-items:center}
.bystate dt:first-child{margin-top:0}
.bystate dt small{font:400 13px var(--body);color:var(--muted)}
.bystate dd{margin:3px 0 0 22px;color:var(--muted);font-size:14.5px}

.vtbl th{font:700 13px var(--pix);vertical-align:middle}
.vtbl th:last-child,.vtbl td:last-child{text-align:right;font-weight:600}
.vtbl th:first-child,.vtbl td:first-child{width:64px}
.vtbl td{padding:9px 10px}

/* header */
header.top.game-head{padding-bottom:30px}
header.top.game-head h1{max-width:19em}
.hdr-seg{margin-top:22px;box-shadow:4px 4px 0 var(--lime);border-color:#fff}
.hdr-seg button[aria-pressed="true"]{background:var(--lime);color:var(--ink)}


/* additions */
header.top::before,.foot::before{content:none;background-image:none}
.segs{display:flex;flex-wrap:wrap;gap:14px 22px}
.notice{margin-bottom:26px}
.stats{margin-top:0}
.seg.sm{box-shadow:3px 3px 0 var(--ink)}
.seg.sm button{font-size:14px;padding:7px 14px}
.hdr-seg.sm{box-shadow:4px 4px 0 var(--lime)}
.sechead{margin-top:34px}
.podium+.sechead,.stats+.podium{margin-top:0}
.podium+.sechead{margin-top:34px}
th.tl,td.tl{text-align:left}
td.tl .sw{vertical-align:-1px;margin-right:2px}
.scale button.lg{font:inherit;color:#c3d1e2;background:transparent;border:2px solid transparent;padding:2px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.scale button.lg:hover{color:#fff;border-color:#34527e}
.scale button.lg[aria-pressed="true"]{color:#fff;border-color:#fff}
.vol li>.sw{width:16px;height:16px;justify-self:center;border:2px solid var(--ink)}
.toolbar h3{flex:1 1 auto}
td.tl{max-width:340px;white-space:normal;color:var(--ink)}
@media (max-width:900px){.hide-sm{display:none}}

,"v":11100000,"rank":3},{"name":"Taylor Swift","v":11100000,"rank":3},{"name":"Ariana Grande","v":9140000,"rank":6},{"name":"Justin Bieber","v":9140000,"rank":6},{"name":"Billie Eilish","v":7480000,"rank":8},{"name":"Bruno Mars","v":7480000,"rank":8},{"name":"Sabrina Carpenter","v":7480000,"rank":8}],"actors":[{"name":"Sydney Sweeney","v":13600000,"rank":1},{"name":"Millie Bobby Brown","v":9140000,"rank":2},{"name":"Anne Hathaway","v":7480000,"rank":3},{"name":"Jacob Elordi","v":7480000,"rank":3},{"name":"Zendaya","v":7480000,"rank":3},{"name":"Sadie Sink","v":6120000,"rank":6},{"name":"Tom Holland","v":6120000,"rank":6},{"name":"Brad Pitt","v":5000000,"rank":8},{"name":"Inde Navarrette","v":4090000,"rank":9},{"name":"Jennifer Lawrence","v":4090000,"rank":9}],"athletes":[{"name":"Cristiano Ronaldo","v":13600000,"rank":1},{"name":"Lamine Yamal","v":13600000,"rank":1},{"name":"Lionel Messi","v":11100000,"rank":3},{"name":"Neymar","v":9140000,"rank":4},{"name":"Jannik Sinner","v":7480000,"rank":5},{"name":"Carlos Alcaraz","v":6120000,"rank":6},{"name":"Erling Haaland","v":6120000,"rank":6},{"name":"Kylian Mbappe","v":6120000,"rank":6},{"name":"LeBron James","v":6120000,"rank":6},{"name":"Harry Kane","v":5000000,"rank":10}]},"usa":{"musicians":[{"name":"KATSEYE","v":4090000,"rank":1},{"name":"Taylor Swift","v":4090000,"rank":1},{"name":"Bad Bunny","v":3350000,"rank":3},{"name":"Ella Langley","v":3350000,"rank":3},{"name":"Ariana Grande","v":2740000,"rank":5},{"name":"Sabrina Carpenter","v":2240000,"rank":6},{"name":"Billie Eilish","v":1830000,"rank":7},{"name":"Bruno Mars","v":1830000,"rank":7},{"name":"Drake","v":1830000,"rank":7},{"name":"Morgan Wallen","v":1830000,"rank":7}],"actors":[{"name":"Sydney Sweeney","v":3350000,"rank":1},{"name":"Millie Bobby Brown","v":2240000,"rank":2},{"name":"Anne Hathaway","v":1830000,"rank":3},{"name":"Jacob Elordi","v":1830000,"rank":3},{"name":"Zendaya","v":1830000,"rank":3},{"name":"Inde Navarrette","v":1500000,"rank":6},{"name":"J <script>
/* Action Network | World's Most Googled Personalities
   Needs: d3 v7, topojson-client, window.PEOPLE_DATA */
(function () {
'use strict';
const D = window.PEOPLE_DATA;
const WORLD_URL = 'https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json';
const US_URL = 'https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json';
const NODATA = '#2a3d5a';
/* one saturated color per name (never grey, which is reserved for no data) */
const COLORS = ['#df2020','#06f906','#0606f9','#06c8f9','#fad12e','#e967cf','#06f9b8','#0677f9','#e99b67','#e806f9','#ade967','#f90677','#7944e4','#f98806','#e96770','#d8f906','#06f9f9','#679be9','#06f977','#f906c8','#e9c767','#79df20','#b567e9','#9806f9','#e9679b','#df9f20','#f95706','#fa2e57'];
const hue = i => COLORS[i % COLORS.length];
const CATS = {musicians:{tab:'Musicians', one:'musician', many:'musicians', n:D.counts.Musicians},
              actors:{tab:'Actors', one:'actor', many:'actors', n:D.counts.Actors},
              athletes:{tab:'Athletes', one:'athlete', many:'athletes', n:D.counts.Athletes}};
const fmt = d3.format(',');
const tip = document.getElementById('tip');
const state = {mode:'world', cat:'musicians', sort:{key:'name', dir:1}, q:'', focus:null};
let geo = null, curPaths = null, curRow = null;

const geoPromise = Promise.all([d3.json(WORLD_URL), d3.json(US_URL)]).then(([w, u]) => {
  geo = {
    world: topojson.feature(w, w.objects.countries).features.filter(f => String(f.id).padStart(3, '0') !== '010'),
    us: topojson.feature(u, u.objects.states).features
  };
}).catch(() => { geo = null; });

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const id3 = f => String(f.id).padStart(3, '0');
const id2 = f => String(f.id).padStart(2, '0');
const sw = c => `<i class="sw" style="background:${c}"></i>`;
function showTip(ev, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 262) + 'px';
  tip.style.top = (ev.clientY + 16) + 'px';
}
const hideTip = () => { tip.style.opacity = 0; };
function setHash(){ try { history.replaceState(null, '', '#' + state.mode); } catch (e) { /* sandboxed frames block this */ } }

/* ---------- map ---------- */
function applyFocus(){
  if (!curPaths) return;
  const cfg = state._cfg;
  curPaths.classed('dim', d => { if (!state.focus) return false; const r = curRow(d); return !r || cfg.group(r[state.cat]) !== state.focus; });
}
async function drawMap(cfg){
  const el = document.getElementById('map'), hud = document.getElementById('hud');
  await geoPromise;
  if (!document.getElementById('map')) return;
  if (!geo){ el.innerHTML = '<div class="maperr">The map shapes could not be loaded. Check your connection and reload the page.</div>'; return; }
  const feats = cfg.kind === 'world' ? geo.world : geo.us;
  const W = 1000, H = cfg.kind === 'world' ? 520 : 590;
  const proj = cfg.kind === 'world' ? d3.geoNaturalEarth1() : d3.geoAlbersUsa();
  proj.fitExtent([[6, 6], [W - 6, H - 6]], {type:'FeatureCollection', features:feats});
  const path = d3.geoPath(proj);
  const svg = d3.select(el).html('').append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img')
    .attr('aria-label', cfg.kind === 'world' ? 'Interactive world map' : 'Interactive map of US states');
  const g = svg.append('g');
  const paths = g.selectAll('path').data(feats).join('path').attr('d', path)
    .attr('fill', d => cfg.fill(d) || NODATA)
    .on('pointerenter', (ev, d) => { hud.innerHTML = cfg.info(d); })
    .on('pointermove', (ev, d) => { const h = cfg.tip(d); if (h) showTip(ev, h); else hideTip(); })
    .on('pointerleave', hideTip)
    .on('click', function (ev, d) {
      paths.classed('sel', false); d3.select(this).classed('sel', true).raise();
      hud.innerHTML = cfg.info(d);
    });
  curPaths = paths; curRow = cfg.row; applyFocus();
  const zoom = d3.zoom().scaleExtent([1, 10]).translateExtent([[0, 0], [W, H]]).extent([[0, 0], [W, H]])
    .filter(ev => ev.type === 'wheel' ? ev.ctrlKey : !ev.button)
    .on('zoom', ev => { g.attr('transform', ev.transform); });
  svg.call(zoom).style('touch-action', 'pan-y');
  document.querySelectorAll('.zoom button').forEach(b => b.onclick = () => {
    const a = b.dataset.z;
    if (a === 'reset') svg.transition().duration(250).call(zoom.transform, d3.zoomIdentity);
    else svg.transition().duration(250).call(zoom.scaleBy, a === 'in' ? 1.7 : 1 / 1.7);
  });
}
function screenHtml(prompt, legend){
  return `<div class="screen"><div class="map" id="map"><div class="maperr">Loading map</div></div>
    <div class="hud"><div class="hud-info" id="hud"><span class="hud-prompt">${prompt}</span></div>
      <div class="zoom"><button type="button" data-z="in" aria-label="Zoom in">+</button><button type="button" data-z="out" aria-label="Zoom out">&minus;</button><button type="button" data-z="reset">Reset</button></div></div>
    <div class="scale" id="legend">${legend}</div><p class="hint">Hover over a place for details (tap on touch screens). Drag to pan. Zoom with the buttons or Ctrl + scroll.</p></div>`;
}
function segHtml(id, label, items, cur, attr){
  return `<div class="seg sm" id="${id}" role="group" aria-label="${label}">${items.map(([k, l]) => `<button type="button" data-${attr}="${k}" aria-pressed="${cur === k}">${l}</button>`).join('')}</div>`;
}
function barList(items, color){
  const mx = d3.max(items, i => i.val) || 1;
  return `<ul class="vol">${items.map(i => `<li><span class="rk ${i.rank <= 3 ? 'r' + i.rank : ''}">${i.rank}</span><span class="lab" title="${esc(i.name)}">${esc(i.name)}</span>
    <span class="trk"><span class="xp" style="--c:${color}"><i style="width:${(i.val / mx * 100).toFixed(1)}%"></i></span><span class="val">${i.text}</span></span></li>`).join('')}</ul>`;
}
function mapCfg(){
  const world = state.mode === 'world', rows = world ? D.countries : D.states, cat = state.cat, c = CATS[cat], idx = {};
  rows.forEach(r => idx[world ? r.iso : r.fips] = r);
  const key = world ? id3 : id2, row = f => idx[key(f)];
  const counts = d3.rollups(rows, v => v.length, r => r[cat]).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const color = {}; counts.forEach(([n], i) => color[n] = hue(i));
  const group = n => n;
  const colorOf = n => color[n];
  const legend = counts.map(([n, k]) => `<button type="button" class="lg" data-g="${esc(n)}" aria-pressed="${state.focus === n}">${sw(color[n])}${esc(n)} (${k})</button>`).join('') + `<span>${sw(NODATA)}No data</span>`;
  const others = r => ['musicians', 'actors', 'athletes'].map(k => `<span>${CATS[k].tab.slice(0, -1)}: <b>${esc(r[k])}</b></span>`).join('');
  const info = f => {
    const r = row(f), nm = esc((f.properties || {}).name || '');
    if (!r) return `<div><div class="hud-name">${nm}</div><div class="hud-line">No data.</div></div>`;
    return `${sw(colorOf(r[cat]))}<div><div class="hud-name">${esc(r.name)}</div><div class="hud-stats">${others(r)}</div></div>`;
  };
  const tp = f => { const r = row(f); return r ? `<b>${esc(r.name)}</b><br>Most Googled ${c.one}: ${esc(r[cat])}` : `<b>${esc((f.properties || {}).name || '')}</b><br>No data`; };
  return {kind: world ? 'world' : 'us', id:key, row, group, fill: f => { const r = row(f); return r ? colorOf(r[cat]) : null; }, info, tip: tp, legend};
}

/* ---------- page parts ---------- */
function viewHtml(){
  const world = state.mode === 'world', c = CATS[state.cat], cfg = mapCfg(); state._cfg = cfg;
  const place = world ? 'country' : 'state';
  const head = `<div class="sechead" style="margin-top:0"><div><h2 class="headline">Most Googled ${c.one} in every ${place}</h2><p class="sub">Each ${place} is colored by the ${c.one} with the most Google searches there. Select a name in the key to highlight its ${world ? 'countries' : 'states'}.</p></div></div>`;
  const t10 = D.top10[world ? 'world' : 'usa'][state.cat].map(r => ({rank:r.rank, name:r.name, val:r.v, text:fmt(r.v)}));
  return head + screenHtml(`Hover over a ${place} to see its most Googled ${c.many}`, cfg.legend) +
    `<div class="card" style="margin-top:34px"><h3>Top 10 most Googled ${c.many} ${world ? 'worldwide' : 'in the US'}</h3><p class="note">Average monthly searches ${world ? 'worldwide' : 'in the United States'}.</p>${barList(t10, '#17b86a')}</div>
    <div class="card" id="tblcard" style="margin-top:34px"></div>` + methodHtml();
}
function mountTable(){
  const world = state.mode === 'world', el = document.getElementById('tblcard'), rows = world ? D.countries : D.states;
  const cols = [['name', world ? 'Country' : 'State'], ['musicians', 'Most Googled musician'], ['actors', 'Most Googled actor'], ['athletes', 'Most Googled athlete']];
  el.innerHTML = `<div class="toolbar"><h3 style="margin:0">All ${rows.length} ${world ? 'countries' : 'states'}</h3><input type="search" id="q" placeholder="Search ${world ? 'countries' : 'states'}" aria-label="Filter" value="${esc(state.q)}"></div>
    <div class="tablewrap"><table id="tbl"><thead></thead><tbody></tbody></table></div>`;
  const fill = () => {
    const th = document.querySelector('#tbl thead');
    th.innerHTML = '<tr>' + cols.map(([k, l]) => `<th scope="col" class="tl" aria-sort="${state.sort.key === k ? (state.sort.dir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" data-k="${k}">${l}${state.sort.key === k ? (state.sort.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`).join('') + '</tr>';
    th.querySelectorAll('button').forEach(b => b.onclick = () => { const k = b.dataset.k; state.sort = state.sort.key === k ? {key:k, dir:-state.sort.dir} : {key:k, dir:1}; fill(); });
    const q = state.q.trim().toLowerCase(), {key, dir} = state.sort;
    const list = rows.filter(r => !q || [r.name, r.musicians, r.actors, r.athletes].join(' ').toLowerCase().includes(q)).slice().sort((a, b) => a[key].localeCompare(b[key]) * dir);
    document.querySelector('#tbl tbody').innerHTML = list.length ? list.map(r => '<tr>' + cols.map(([k]) => `<td class="tl">${esc(r[k])}</td>`).join('') + '</tr>').join('') : `<tr><td colspan="4" style="text-align:center;color:#53657b">No matches.</td></tr>`;
  };
  document.getElementById('q').oninput = e => { state.q = e.target.value; fill(); };
  fill();
}
function methodHtml(){
  return `<section class="method"><h3>Methodology</h3><ul>
    <li>Search data comes from Google Keyword Planner and covers average monthly searches over the last 12 months. Keyword Planner reports volumes in rounded bands, so figures are approximate and some names share the same number.</li>
    <li>In total, <b>${D.total}</b> names are tracked: <b>${D.counts.Musicians}</b> musicians, <b>${D.counts.Actors}</b> actors and <b>${D.counts.Athletes}</b> athletes.</li>
    <li>The top 10 lists rank names by average monthly searches. Names with the same number of searches share a rank.</li>
    <li>The most Googled musician, actor and athlete in each ${state.mode === 'world' ? 'country' : 'state'} is the one with the most searches among the tracked names.</li>
    ${state.mode === 'world' ? '<li>Countries missing from the search data are shown as no data.</li>' : ''}</ul></section>`;
}
function render(){
  const world = state.mode === 'world', c = CATS[state.cat];
  const title = world ? `World’s Most Googled ${c.tab} in 2026` : `America’s Most Googled ${c.tab}, State by State`;
  document.getElementById('title').textContent = title;
  document.title = title.replace(' in 2026', '') + ' | Action Network';
  document.getElementById('lede').innerHTML = world
    ? `This page tracks Google searches for <b>${D.total} famous names</b>, including <b>${c.n} ${c.many}</b>. It shows the 10 most Googled ${c.many} worldwide and the most Googled ${c.one} in each of <b>${D.countries.length} countries</b>.`
    : `This page shows the most Googled ${c.one} in each of the <b>${D.states.length} US states</b>, based on Google searches for <b>${c.n} ${c.many}</b>, along with the 10 most Googled ${c.many} in the US.`;
  document.getElementById('chips').innerHTML = [[D.counts.Musicians, 'musicians'], [D.counts.Actors, 'actors'], [D.counts.Athletes, 'athletes'], [world ? D.countries.length : D.states.length, world ? 'countries' : 'states']].map(([n, l]) => `<div class="chip"><b>${n}</b><span>${l}</span></div>`).join('');
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
  document.querySelectorAll('#catSeg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === state.cat)));
  document.getElementById('app').innerHTML = viewHtml();
  document.querySelectorAll('#legend .lg').forEach(b => b.onclick = () => {
    state.focus = state.focus === b.dataset.g ? null : b.dataset.g;
    document.querySelectorAll('#legend .lg').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.g === state.focus)));
    applyFocus();
  });
  mountTable(); curPaths = null; drawMap(state._cfg); setHash();
}
const reset = () => { state.focus = null; state.q = ''; };
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; reset(); render(); });
document.querySelectorAll('#catSeg button').forEach(b => b.onclick = () => { state.cat = b.dataset.cat; reset(); render(); });
if (location.hash === '#usa') state.mode = 'usa';
render();
})();

</script>
